spring.application.name=ms-claims-services

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/claimDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:claimDB}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

server.port=${SERVER_PORT:8095}

logging.level.com.zaxxer.hikari=WARN
logging.level.com.santander=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.zaxxer.hikari.HikariConfig=INFO

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true

aws.region=sa-east-1
aws.s3.bucket=${bucket-name}
